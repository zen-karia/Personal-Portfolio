<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1117"/>
      <stop offset="100%" style="stop-color:#1a1d2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00b4d8"/>
      <stop offset="100%" style="stop-color:#0077b6"/>
    </linearGradient>
    <radialGradient id="queryGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00e0ff"/>
      <stop offset="100%" style="stop-color:#0077b6"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle grid background -->
  <g stroke="#1e2235" stroke-width="1" opacity="0.6">
    <line x1="0" y1="56" x2="800" y2="56"/>
    <line x1="0" y1="112" x2="800" y2="112"/>
    <line x1="0" y1="168" x2="800" y2="168"/>
    <line x1="0" y1="224" x2="800" y2="224"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="0" y1="336" x2="800" y2="336"/>
    <line x1="0" y1="392" x2="800" y2="392"/>
    <line x1="80" y1="0" x2="80" y2="450"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="240" y1="0" x2="240" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="560" y1="0" x2="560" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
    <line x1="720" y1="0" x2="720" y2="450"/>
  </g>

  <!-- Vector space (nearest-neighbor visualization) -->
  <g transform="translate(60, 80)">
    <!-- Panel border glow -->
    <rect x="-3" y="-3" width="326" height="326" rx="6" fill="none" stroke="#00b4d8" stroke-width="1.5" opacity="0.5" filter="url(#glow)"/>
    <!-- Panel -->
    <rect width="320" height="320" rx="4" fill="#141724"/>

    <!-- Axes -->
    <g stroke="#1e2a3a" stroke-width="0.8">
      <line x1="20" y1="300" x2="300" y2="300"/>
      <line x1="20" y1="20" x2="20" y2="300"/>
    </g>

    <!-- Connections from query to K nearest neighbors -->
    <g stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.8">
      <line x1="160" y1="160" x2="110" y2="120"/>
      <line x1="160" y1="160" x2="205" y2="110"/>
      <line x1="160" y1="160" x2="140" y2="212"/>
      <line x1="160" y1="160" x2="216" y2="192"/>
      <line x1="160" y1="160" x2="98" y2="182"/>
    </g>

    <!-- Search radius ring -->
    <circle cx="160" cy="160" r="70" fill="none" stroke="#00b4d8" stroke-width="1" stroke-dasharray="4 5" opacity="0.4"/>

    <!-- Background (non-neighbor) vectors -->
    <g fill="#3a4a63" opacity="0.85">
      <circle cx="45" cy="55" r="5"/>
      <circle cx="70" cy="255" r="5"/>
      <circle cx="255" cy="60" r="5"/>
      <circle cx="278" cy="242" r="5"/>
      <circle cx="62" cy="110" r="5"/>
      <circle cx="232" cy="268" r="5"/>
      <circle cx="192" cy="52" r="5"/>
      <circle cx="120" cy="288" r="5"/>
      <circle cx="272" cy="150" r="5"/>
      <circle cx="48" cy="200" r="5"/>
      <circle cx="288" cy="100" r="5"/>
      <circle cx="35" cy="150" r="5"/>
      <circle cx="250" cy="205" r="5"/>
      <circle cx="95" cy="45" r="5"/>
    </g>

    <!-- K nearest neighbors (highlighted) -->
    <g fill="#00b4d8">
      <circle cx="110" cy="120" r="6"/>
      <circle cx="205" cy="110" r="6"/>
      <circle cx="140" cy="212" r="6"/>
      <circle cx="216" cy="192" r="6"/>
      <circle cx="98" cy="182" r="6"/>
    </g>

    <!-- Query vector -->
    <circle cx="160" cy="160" r="11" fill="url(#queryGlow)" filter="url(#glow)"/>
    <circle cx="160" cy="160" r="11" fill="none" stroke="#e0f4ff" stroke-width="1.5"/>

    <!-- Label -->
    <text x="160" y="140" font-family="monospace" font-size="10" fill="#8899bb" text-anchor="middle">query</text>
    <text x="300" y="316" font-family="monospace" font-size="9" fill="#4a5a73" text-anchor="end">top-K nearest neighbors</text>
  </g>

  <!-- Right side content -->
  <g transform="translate(440, 80)">
    <!-- Title -->
    <text font-family="'Courier New', monospace" font-size="38" font-weight="bold" fill="#ffffff" filter="url(#glow)">Proxima</text>
    <!-- Cyan underline -->
    <rect y="48" width="220" height="2" fill="url(#accentGrad)" rx="1"/>

    <!-- Tag line -->
    <text y="80" font-family="'Courier New', monospace" font-size="13" fill="#8899bb">In-Memory Vector Database</text>

    <!-- Feature badges -->
    <g transform="translate(0, 110)">
      <rect width="150" height="26" rx="13" fill="#0a2540" stroke="#00b4d8" stroke-width="1"/>
      <text x="75" y="17" font-family="monospace" font-size="11" fill="#00b4d8" text-anchor="middle">SIMD / ARM NEON</text>

      <rect y="38" width="160" height="26" rx="13" fill="#0a2540" stroke="#00b4d8" stroke-width="1"/>
      <text x="80" y="55" font-family="monospace" font-size="11" fill="#00b4d8" text-anchor="middle">Top-K NN Search</text>

      <rect y="76" width="176" height="26" rx="13" fill="#0a2540" stroke="#00b4d8" stroke-width="1"/>
      <text x="88" y="93" font-family="monospace" font-size="11" fill="#00b4d8" text-anchor="middle">Cosine / L2 Distance</text>

      <rect y="114" width="168" height="26" rx="13" fill="#0a2540" stroke="#00b4d8" stroke-width="1"/>
      <text x="84" y="131" font-family="monospace" font-size="11" fill="#00b4d8" text-anchor="middle">Append-Only Persistence</text>
    </g>

    <!-- Code snippet -->
    <g transform="translate(0, 320)">
      <rect width="320" height="70" rx="6" fill="#0d1117" stroke="#2a3a4a" stroke-width="1"/>
      <text x="12" y="20" font-family="'Courier New', monospace" font-size="11" fill="#6e7f8d">// 3.2x faster distance kernel (NEON)</text>
      <text x="12" y="36" font-family="'Courier New', monospace" font-size="11">
        <tspan fill="#c792ea">float32x4_t</tspan>
        <tspan fill="#e0e0e0"> d = </tspan>
        <tspan fill="#82aaff">vsubq_f32</tspan>
        <tspan fill="#e0e0e0">(a, b);</tspan>
      </text>
      <text x="12" y="52" font-family="'Courier New', monospace" font-size="11">
        <tspan fill="#e0e0e0">acc = </tspan>
        <tspan fill="#82aaff">vfmaq_f32</tspan>
        <tspan fill="#e0e0e0">(acc, d, d);</tspan>
      </text>
      <text x="12" y="68" font-family="'Courier New', monospace" font-size="11" fill="#6e7f8d">// top-10 in 107us @ 10K vectors</text>
    </g>

    <!-- Tech stack -->
    <g transform="translate(0, 406)">
      <rect width="50" height="20" rx="4" fill="#1e2a1e" stroke="#4caf50" stroke-width="0.8"/>
      <text x="25" y="14" font-family="monospace" font-size="10" fill="#4caf50" text-anchor="middle">C++</text>
      <rect x="58" width="52" height="20" rx="4" fill="#1e2a1e" stroke="#4caf50" stroke-width="0.8"/>
      <text x="84" y="14" font-family="monospace" font-size="10" fill="#4caf50" text-anchor="middle">SIMD</text>
      <rect x="118" width="58" height="20" rx="4" fill="#1e2a1e" stroke="#4caf50" stroke-width="0.8"/>
      <text x="147" y="14" font-family="monospace" font-size="10" fill="#4caf50" text-anchor="middle">CMake</text>
    </g>
  </g>
</svg>
